<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mainboard Drag & Drop Trainer — Refactored</title>
<style>
  :root {
    --bg: #0f1b2d; --panel: #15233a; --accent: #23c483; --accent-red: #ff4d4f;
    --text: #eaf0ff; --muted: #a8b3c7;
    --zone: rgba(255, 153, 0, 0.22);
    --zone-border: rgba(255, 153, 0, 0.95);
    --zone-correct: rgba(35, 196, 131, 0.22);
    --zone-wrong: rgba(255, 77, 79, 0.28);
    --overlay: rgba(5, 10, 22, 0.7);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
  
  .app { display: grid; grid-template-columns: 360px 1fr; gap: 16px; height: 100vh; padding: 16px; }
  
  .sidebar { background: var(--panel); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar h2 { margin: 0 0 8px; font-size: 20px; }
  .hint { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .controls .wide { grid-column: 1 / -1; }
  
  .btn { appearance: none; border: none; border-radius: 10px; padding: 10px 12px; color: #0b1628; font-weight: 600; cursor: pointer; background: #eaf0ff; transition: transform 120ms ease, filter 120ms ease; font-size: 14px; }
  .btn.secondary { background: #cfe0ff; }
  .btn.warn { background: #ffd9d9; color: #5a1010; }
  .btn.active-mode { background: var(--accent); color: #062016; }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(0.98); filter: brightness(0.95); }

  .score { padding: 10px 12px; border-radius: 10px; background: #0c1730; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .score b { color: var(--text); }
  
  .list { display: grid; gap: 8px; margin-top: 12px; }

  .chip {
    user-select: none; touch-action: none; background: #0c1730; border: 2px solid #274163; color: var(--text);
    padding: 10px 12px; border-radius: 10px; font-weight: 700; box-shadow: 0 2px 0 #091026;
    width: 100%; text-align: left; position: relative; font-size: 15px; line-height: 1.2; cursor: grab;
    transition: border-color 140ms ease, background 140ms ease, transform 120ms ease;
  }
  .chip:hover:not(.locked) { border-color: #4a75a8; }
  .chip.selected { border-color: #ff9900; background: #1a2a47; box-shadow: 0 0 0 2px rgba(255, 153, 0, 0.35); }
  .chip.dragging { opacity: 0.95; transform: scale(1.04); cursor: grabbing; z-index: 1000; width: auto !important; white-space: nowrap; pointer-events: none; }
  
  /* Wenn der Chip in einer Zone eingerastet ist */
  .chip.locked {
    position: absolute; inset: 4px; width: calc(100% - 8px); height: calc(100% - 8px);
    background: rgba(12, 23, 48, 0.88); border: 1px solid var(--accent); color: var(--accent);
    cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 4px; font-size: clamp(10px, 1.1vw, 14px); white-space: normal; word-break: break-word;
    hyphens: auto; box-shadow: none; border-radius: 6px;
  }

  /* Board & prozentuales Bild-Overlay */
  .board { position: relative; background: var(--panel); border-radius: 12px; padding: 16px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  
  .board-stage {
    position: relative;
    display: inline-flex;
    max-width: 100%;
    max-height: calc(100vh - 64px);
    aspect-ratio: 1 / 1;
  }
  #boardImg {
    display: block; width: 100%; height: 100%; border-radius: 8px;
    object-fit: contain; background: #0c1730; user-select: none; -webkit-user-drag: none;
  }
  #zonesLayer {
    position: absolute; inset: 0; pointer-events: none;
  }

  .zone {
    position: absolute;
    border: 2px dashed var(--zone-border);
    background: var(--zone);
    border-radius: 8px;
    pointer-events: auto;
    cursor: pointer;
    transition: background 140ms ease, border-color 140ms ease, transform 100ms ease, opacity 200ms ease, box-shadow 140ms ease;
  }
  .zone.zones-hidden:not(.correct) { opacity: 0; pointer-events: none; }
  .zone.highlight {
    background: rgba(255, 153, 0, 0.4);
    transform: scale(1.02);
    box-shadow: 0 0 0 3px rgba(255, 153, 0, 0.4);
  }
  .zone.correct { border-style: solid; border-color: var(--accent); background: var(--zone-correct); }
  .zone.wrong   { border-color: var(--accent-red); background: var(--zone-wrong); }
  
  /* Editor-Modus */
  .zone.editable { cursor: move; outline: 1px solid rgba(255,255,255,0.4); opacity: 1 !important; pointer-events: auto !important; }
  .zone .grip {
    position: absolute; right: -7px; bottom: -7px; width: 15px; height: 15px;
    background: #eaf0ff; border: 2px solid #0b1628; border-radius: 50%;
    cursor: nwse-resize; display: none; z-index: 5;
  }
  .zone.editable .grip { display: block; }
  .zone-label-preview {
    position: absolute; top: -20px; left: 0; background: #0c1730; color: #ff9900;
    font-size: 11px; padding: 2px 5px; border-radius: 4px; white-space: nowrap;
    pointer-events: none; display: none; border: 1px solid #274163;
  }
  .zone.editable .zone-label-preview { display: block; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 24px;
    background: #0c1730; border: 2px solid #274163; color: var(--text);
    border-radius: 12px; padding: 12px 18px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 4200;
    transition: opacity 200ms ease;
  }
  .hidden { display: none !important; }

  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 4000; backdrop-filter: blur(2px); }
  .modal-card {
    position: fixed; z-index: 4100; left: 50%; top: 12%; transform: translateX(-50%);
    width: min(680px, 92vw); max-height: 80vh; overflow-y: auto;
    background: #0c1730; border: 2px solid #274163; color: var(--text);
    border-radius: 12px; padding: 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5);
  }
  .modal-card h3 { margin: 0 0 10px; color: var(--accent); }
  .modal-card .actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  #infoBody ul, #extraInfo ul { margin: 8px 0 0 18px; color: var(--muted); line-height: 1.5; }
  #infoBody li, #extraInfo li { margin-bottom: 4px; }

  .pulse { animation: pulse 900ms ease-in-out 2; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  #confetti { position: fixed; inset: 0; z-index: 4050; pointer-events: none; }

  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    .board-stage { max-height: 70vh; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h2>Mainboard Trainer</h2>
      <p class="hint">Ziehe die Begriffe auf das Board oder klicke erst den Begriff und dann die Zone an.</p>
      <div class="controls">
        <button class="btn" id="shuffleBtn">Mischen</button>
        <button class="btn" id="fullscreenBtn">Vollbild</button>
        <button class="btn secondary" id="toggleEditBtn">Ziel‑Editor</button>
        <button class="btn secondary" id="saveZonesBtn">Zonen speichern</button>
        <button class="btn secondary" id="exportZonesBtn">Export (JSON)</button>
        <button class="btn secondary" id="importZonesBtn">Import (JSON)</button>
        <button class="btn secondary wide" id="toggleZonesBtn">Zonen ausblenden</button>
        <button class="btn warn wide" id="resetBtn">Zurücksetzen</button>
      </div>
      <div class="score">
        <div>Score: <b id="scoreVal">0</b> / <span id="scoreMax">0</span></div>
        <div id="progressText">Los geht’s!</div>
      </div>
      <div class="list" id="chipsList"></div>
    </aside>

    <main class="board">
      <div class="board-stage" id="boardStage">
        <img id="boardImg" width="1000" height="1000"
             src="https://asset.conrad.com/media10/isa/160267/c1/-/de/002842510PI00/image.jpg?x=1000&y=1000&format=jpg&ex=1000&ey=1000&align=center"
             alt="Mainboard Bild (ohne Beschriftung)" />
        <div id="zonesLayer"></div>
      </div>
      <canvas id="confetti"></canvas>
      <div class="toast hidden" id="toast"></div>
    </main>
  </div>

  <div class="overlay hidden" id="overlay"></div>
  
  <div id="infoCard" class="modal-card hidden" role="dialog" aria-modal="true">
    <h3 id="infoTitle">Komponente</h3>
    <div id="infoBody">Beschreibung</div>
    <div class="actions"><button class="btn" id="closeInfoBtn">Weiter</button></div>
  </div>

  <div id="winCard" class="modal-card hidden" role="dialog" aria-modal="true">
    <h3 id="winTitle" class="pulse">Glückwunsch! Alles korrekt 🎉</h3>
    <p>Du hast alle Komponenten fehlerfrei zugeordnet. Stark!</p>
    <h4>Extra‑Wissen für die Praxis & Prüfung:</h4>
    <div id="extraInfo"></div>
    <div class="actions"><button class="btn" id="restartBtn">Neu starten</button></div>
  </div>

  <input type="file" class="hidden" id="zonesFileInput" accept="application/json" />

<script>
  const COMPONENTS = [
    { key: 'cpu_socket', label: 'CPU‑Sockel',
      info: `Der CPU‑Sockel verbindet Prozessor und Mainboard mechanisch & elektrisch.
        <ul>
          <li><b>PGA (Pin Grid Array):</b> Pins an der CPU (z. B. AMD AM4).</li>
          <li><b>LGA (Land Grid Array):</b> Kontakte im Sockel (z. B. Intel LGA1700/1851 & AMD AM5).</li>
          <li>Beim Kühlerkauf immer auf die Sockel‑Kompatibilität (Lochabstände/Backplate) achten.</li>
        </ul>` },
    { key: 'ram_slots', label: 'RAM‑Slots (DIMM)',
      info: `Steckplätze für den Arbeitsspeicher (DDR4 / DDR5 DIMMs).
        <ul>
          <li>Meist 2–4 Slots für Dual‑Channel‑Betrieb (höhere Speicherbandbreite).</li>
          <li>Bei 2 Riegeln auf 4 Slots wird meist <b>A2 und B2</b> (2. und 4. Slot von der CPU aus) bestückt.</li>
          <li>Volle Taktraten müssen im UEFI über <b>XMP</b> (Intel) bzw. <b>EXPO</b> (AMD) aktiviert werden.</li>
        </ul>` },
    { key: 'pcie_x16', label: 'PCIe x16‑Slot (Grafikkarte)',
      info: `Schnellster Erweiterungssteckplatz, primär für Grafikkarten.
        <ul>
          <li>Der oberste Slot ist direkt mit 16 Lanes an die CPU angebunden (geringste Latenz).</li>
          <li>Abwärtskompatibel: Auch x1-, x4- oder x8-Karten passen mechanisch und elektrisch hinein.</li>
          <li>Vor dem Ausbau der GPU immer den kleinen Verriegelungshebel am Slot-Ende lösen!</li>
        </ul>` },
    { key: 'm2_slot', label: 'M.2‑Slot (NVMe / SATA)',
      info: `Kompakter Steckplatz für schnelle M.2‑SSDs.
        <ul>
          <li><b>M‑Key (PCIe/NVMe):</b> Über bis zu 4 PCIe-Lanes direkt angebunden – extrem hohe Datenraten.</li>
          <li><b>B+M‑Key (SATA):</b> Nutzt das ältere SATA-Protokoll (max. ~600 MB/s).</li>
          <li>Formfaktoren wie <b>2280</b> stehen für 22 mm Breite und 80 mm Länge.</li>
        </ul>` },
    { key: 'sata_ports', label: 'SATA‑Anschlüsse',
      info: `Anschlüsse für klassische 2,5"-SSDs, 3,5"-HDDs und optische Laufwerke.
        <ul>
          <li>SATA III bietet brutto <b>6 Gbit/s</b> (netto ca. 550–600 MB/s).</li>
          <li>Punkt-zu-Punkt-Verbindung: Ein Datenkabel pro Laufwerk + separater SATA-Stromstecker vom Netzteil.</li>
          <li>Achtung: Manche SATA-Ports teilen sich die Bandbreite (Lanes) mit einem M.2-Slot.</li>
        </ul>` },
    { key: 'atx_24pin', label: '24‑Pin ATX‑Stromanschluss',
      info: `Hauptstromversorgung für das Mainboard und die darauf verbauten Komponenten.
        <ul>
          <li>Liefert <b>+3,3 V, +5 V und +12 V</b> sowie das Power-Good-Signal.</li>
          <li>Oft als 20+4‑Pin‑Stecker ausgeführt (aus historischer Abwärtskompatibilität).</li>
        </ul>` },
    { key: 'eps_8pin', label: 'CPU Power Header (EPS)',
      info: `Dedizierte +12V‑Stromversorgung für den Prozessor bzw. die VRMs.
        <ul>
          <li>Meist als 8‑Pin (4+4 teilbar) oder 2× 8‑Pin ausgeführt.</li>
          <li><b>Wichtig:</b> Nicht mit dem 6+2‑Pin PCIe‑Stecker für Grafikkarten verwechseln (unterschiedliche Polung!).</li>
        </ul>` },
    { key: 'vrm', label: 'VRMs (Spannungswandler)',
      info: `Voltage Regulator Module: Wandelt die +12 V vom Netzteil in die präzise Kernspannung der CPU (oft 1,1 V – 1,4 V) um.
        <ul>
          <li>Besteht aus MOSFETs, Spulen (Chokes) und Kondensatoren.</li>
          <li>Mehr Phasen verteilen die Abwärme besser; auf guten Boards sitzen hier massive Kühlkörper.</li>
        </ul>` },
    { key: 'cpu_fan_header', label: 'CPU‑Lüfter‑Header',
      info: `4‑Pin PWM‑Anschluss für den Lüfter des Prozessorkühlers.
        <ul>
          <li><b>Pin 1:</b> Masse | <b>Pin 2:</b> +12 V | <b>Pin 3:</b> Tachosignal | <b>Pin 4:</b> PWM-Steuersignal.</li>
          <li>Ohne Tachosignal am <code>CPU_FAN</code> verweigern viele Boards aus Sicherheitsgründen den Bootvorgang ("CPU Fan Error").</li>
        </ul>` },
    { key: 'chipset', label: 'Chipsatz (PCH) / Kühlkörper',
      info: `Platform Controller Hub: Der zentrale I/O‑Knotenpunkt auf dem Mainboard.
        <ul>
          <li>Verwaltet USB-Ports, SATA-Anschlüsse, Onboard-LAN/Audio und zusätzliche PCIe-Lanes.</li>
          <li>Ist über eine schnelle Direktleitung (DMI bei Intel, PCIe-Downlink bei AMD) mit der CPU verbunden.</li>
        </ul>` },
    { key: 'cmos_battery', label: 'CMOS‑Batterie (CR2032)',
      info: `Knopfzelle zur Pufferung der Echtzeituhr (RTC) und des flüchtigen CMOS-Speichers.
        <ul>
          <li>Hält Datum, Uhrzeit und UEFI-Einstellungen, wenn der PC komplett vom Stromnetz getrennt ist.</li>
          <li>Ein Herausnehmen (oder Überbrücken der <code>CLR_CMOS</code>-Pins) setzt das UEFI auf Werkseinstellungen zurück.</li>
        </ul>` },
    { key: 'usb_header', label: 'USB‑Header (intern)',
      info: `Pfostenstecker zum Verbinden der Gehäuse-Frontanschlüsse.
        <ul>
          <li><b>USB 2.0:</b> 9‑Pin Blockstecker.</li>
          <li><b>USB 3.0 / 3.2 Gen1:</b> Breiter 19‑Pin Stecker.</li>
          <li><b>USB‑C (Front):</b> Kompakte Key‑A Buchse für moderne Gehäuse.</li>
        </ul>` },
  ];

  const DEFAULT_ZONES = [
    { key: 'cpu_socket',     x: 42,   y: 33,   w: 16,  h: 20 },
    { key: 'ram_slots',      x: 60.8, y: 18,   w: 8.7, h: 40 },
    { key: 'pcie_x16',       x: 34.5, y: 63.5, w: 31,  h: 7.2 },
    { key: 'm2_slot',        x: 43.5, y: 53.5, w: 25,  h: 6.2 },
    { key: 'sata_ports',     x: 72.5, y: 78.5, w: 20,  h: 7.5 },
    { key: 'atx_24pin',      x: 83.5, y: 34,   w: 6.2, h: 14.2 },
    { key: 'eps_8pin',       x: 5.2,  y: 6,    w: 8.5, h: 10.5 },
    { key: 'vrm',            x: 18.5, y: 14.5, w: 20,  h: 18 },
    { key: 'cpu_fan_header', x: 72.5, y: 6.5,  w: 12,  h: 10 },
    { key: 'chipset',        x: 57,   y: 71.5, w: 12,  h: 12 },
    { key: 'cmos_battery',   x: 52,   y: 66.8, w: 8,   h: 10 },
    { key: 'usb_header',     x: 46,   y: 90,   w: 22,  h: 8 },
  ];

  const EXTRA_INFO = `
    <ul>
      <li><b>Direct CPU Lanes vs. Chipsatz-Lanes:</b> Die Grafikkarte (oberster PCIe x16) und die primäre NVMe-SSD sind direkt an die CPU angebunden. Alles Weitere läuft über den Chipsatz (PCH) und teilt sich dessen Uplink-Bandbreite zur CPU.</li>
      <li><b>Lane-Sharing:</b>Auf vielen Boards deaktiviert die Nutzung eines zweiten oder dritten M.2-Slots bestimmte SATA-Ports oder reduziert die Lanes eines unteren PCIe-Slots. Blick ins Handbuch lohnt sich!</li>
      <li><b>UEFI-Klassiker nach dem Zusammenbau:</b> XMP/EXPO für den RAM aktivieren, Lüfterkurven prüfen und Resizeable BAR (SAM) für die Grafikkarte einschalten.</li>
    </ul>
  `;

  let ZONES = structuredClone(DEFAULT_ZONES);

  const state = {
    score: 0,
    total: COMPONENTS.length,
    showZones: true,
    editing: false,
    selectedChip: null,
    imageKey: 'conrad-002842510PI00',
    toastTimer: null
  };

  // DOM Referenzen
  const zonesLayer = document.getElementById('zonesLayer');
  const chipsList = document.getElementById('chipsList');
  const scoreVal = document.getElementById('scoreVal');
  const scoreMax = document.getElementById('scoreMax');
  const progressText = document.getElementById('progressText');
  const toast = document.getElementById('toast');
  const overlay = document.getElementById('overlay');
  const infoCard = document.getElementById('infoCard');
  const infoTitle = document.getElementById('infoTitle');
  const infoBody = document.getElementById('infoBody');
  const winCard = document.getElementById('winCard');
  const winTitle = document.getElementById('winTitle');
  const extraInfo = document.getElementById('extraInfo');

  const shuffleBtn = document.getElementById('shuffleBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const toggleZonesBtn = document.getElementById('toggleZonesBtn');
  const toggleEditBtn = document.getElementById('toggleEditBtn');
  const saveZonesBtn = document.getElementById('saveZonesBtn');
  const exportZonesBtn = document.getElementById('exportZonesBtn');
  const importZonesBtn = document.getElementById('importZonesBtn');
  const zonesFileInput = document.getElementById('zonesFileInput');
  const resetBtn = document.getElementById('resetBtn');
  const closeInfoBtn = document.getElementById('closeInfoBtn');
  const restartBtn = document.getElementById('restartBtn');
  const confettiCanvas = document.getElementById('confetti');
  const ctx = confettiCanvas.getContext('2d');

  // --- Initialisierung ---
  (async function init() {
    scoreMax.textContent = state.total;
    buildChips();
    await loadInitialZones();
    renderZones();
    updateScore();
    resizeCanvas();
  })();

  window.addEventListener('resize', resizeCanvas);

  // Lade-Logik: 1. LocalStorage (eigene Edits) -> 2. Hosted JSON -> 3. Default
  async function loadInitialZones() {
    const saved = localStorage.getItem('zones-' + state.imageKey);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed) && parsed.length) {
          ZONES = parsed;
          return;
        }
      } catch (e) { console.warn('LocalStorage Zonen defekt:', e); }
    }

    try {
      const res = await fetch('Final Zones2.json', { cache: 'no-store' });
      if (res.ok) {
        const data = await res.json();
        const nextZones = Array.isArray(data) ? data : data.zones;
        if (nextZones?.length) {
          ZONES = nextZones.map(z => ({ key: z.key, x: Number(z.x), y: Number(z.y), w: Number(z.w), h: Number(z.h) }));
          if (data.imageKey) state.imageKey = data.imageKey;
        }
      }
    } catch {
      // Ignorieren, falls lokal ohne Server geöffnet (CORS/404) -> nutzt DEFAULT_ZONES
    }
  }

  // --- Chips & Zonen rendern ---
  function buildChips() {
    chipsList.innerHTML = '';
    COMPONENTS.forEach(comp => {
      const chip = document.createElement('button');
      chip.className = 'chip';
      chip.textContent = comp.label;
      chip.dataset.key = comp.key;
      chipsList.appendChild(chip);
      setupChipInteraction(chip);
    });
  }

  function renderZones() {
    // Bevor Zonen neu gebaut werden: Eingelockte Chips kurz sichern
    const lockedChips = new Map();
    zonesLayer.querySelectorAll('.chip.locked').forEach(ch => {
      lockedChips.set(ch.dataset.key, ch);
    });

    zonesLayer.innerHTML = '';

    ZONES.forEach(z => {
      const el = document.createElement('div');
      el.className = 'zone';
      if (!state.showZones) el.classList.add('zones-hidden');
      el.dataset.key = z.key;

      // Direkte CSS-Prozente statt JS-Pixel-Mathe!
      el.style.left   = `${z.x}%`;
      el.style.top    = `${z.y}%`;
      el.style.width  = `${z.w}%`;
      el.style.height = `${z.h}%`;

      // Editor-Vorschau-Label & Resize-Griff
      const comp = COMPONENTS.find(c => c.key === z.key);
      const preview = document.createElement('span');
      preview.className = 'zone-label-preview';
      preview.textContent = comp ? comp.label : z.key;
      el.appendChild(preview);

      const grip = document.createElement('div');
      grip.className = 'grip';
      el.appendChild(grip);

      if (state.editing) {
        el.classList.add('editable');
        enableZoneDragAndResize(el, grip, z);
      }

      // Klick auf Zone (für Click-to-Place oder zum Nachlesen gelöster Zonen)
      el.addEventListener('click', (e) => {
        if (state.editing) return;
        if (el.classList.contains('correct')) {
          openInfoModal(comp);
          return;
        }
        if (state.selectedChip) {
          e.stopPropagation();
          attemptPlacement(state.selectedChip, el);
        }
      });

      // Falls Zone schon gelöst war, Chip wieder einhängen
      if (lockedChips.has(z.key)) {
        el.classList.add('correct');
        el.appendChild(lockedChips.get(z.key));
      }

      zonesLayer.appendChild(el);
    });
  }

  // --- Drag & Drop + Click-to-Select für Chips ---
  function setupChipInteraction(chip) {
    let dragging = false, hasMoved = false, startX = 0, startY = 0, grabOffsetX = 0, grabOffsetY = 0;

    chip.addEventListener('pointerdown', (ev) => {
      if (chip.classList.contains('locked') || state.editing) return;
      ev.preventDefault();
      dragging = true;
      hasMoved = false;
      chip.setPointerCapture(ev.pointerId);

      const rect = chip.getBoundingClientRect();
      startX = ev.clientX;
      startY = ev.clientY;
      grabOffsetX = ev.clientX - rect.left;
      grabOffsetY = ev.clientY - rect.top;
    });

    chip.addEventListener('pointermove', (ev) => {
      if (!dragging) return;
      const dist = Math.hypot(ev.clientX - startX, ev.clientY - startY);
      
      // Erst ab 5px Bewegung als echtes Ziehen werten (sonst ist es ein Klick)
      if (!hasMoved && dist > 5) {
        hasMoved = true;
        selectChip(null);
        chip.classList.add('dragging');
        chip.style.position = 'fixed';
      }

      if (hasMoved) {
        chip.style.left = `${ev.clientX - grabOffsetX}px`;
        chip.style.top  = `${ev.clientY - grabOffsetY}px`;
        highlightZones(ev.clientX, ev.clientY);
      }
    });

    const endDrag = (ev) => {
      if (!dragging) return;
      dragging = false;
      chip.releasePointerCapture(ev.pointerId);

      if (!hasMoved) {
        // War nur ein kurzer Klick -> Auswahl umschalten
        selectChip(state.selectedChip === chip ? null : chip);
        return;
      }

      chip.classList.remove('dragging');
      chip.style.position = chip.style.left = chip.style.top = '';
      clearZoneHighlights();

      const target = getHitZone(ev.clientX, ev.clientY);
      if (target && !target.classList.contains('correct')) {
        attemptPlacement(chip, target);
      } else if (target && target.classList.contains('correct')) {
        showToast('Diese Zone ist bereits gelöst.');
      }
    };

    chip.addEventListener('pointerup', endDrag);
    chip.addEventListener('pointercancel', () => {
      if (!dragging) return;
      dragging = false;
      chip.classList.remove('dragging');
      chip.style.position = chip.style.left = chip.style.top = '';
      clearZoneHighlights();
    });
  }

  function selectChip(chip) {
    document.querySelectorAll('.chip.selected').forEach(c => c.classList.remove('selected'));
    state.selectedChip = chip;
    if (chip) chip.classList.add('selected');
  }

  function attemptPlacement(chip, zoneEl) {
    selectChip(null);
    if (zoneEl.dataset.key === chip.dataset.key) {
      zoneEl.classList.add('correct');
      chip.classList.add('locked');
      zoneEl.appendChild(chip);

      state.score += 1;
      updateScore();
      showToast('✅ Richtig!');

      const comp = COMPONENTS.find(c => c.key === chip.dataset.key);
      openInfoModal(comp);
      checkWin();
    } else {
      zoneEl.classList.add('wrong');
      setTimeout(() => zoneEl.classList.remove('wrong'), 350);
      showToast('❌ Falsch – versuch’s nochmal');
    }
  }

  function getHitZone(cx, cy) {
    return Array.from(zonesLayer.querySelectorAll('.zone')).find(z => {
      const r = z.getBoundingClientRect();
      return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
    }) || null;
  }

  function highlightZones(cx, cy) {
    clearZoneHighlights();
    const target = getHitZone(cx, cy);
    if (target && !target.classList.contains('correct')) {
      target.classList.add('highlight');
    }
  }

  function clearZoneHighlights() {
    zonesLayer.querySelectorAll('.zone.highlight').forEach(z => z.classList.remove('highlight'));
  }

  // --- Editor-Modus (arbeitet direkt mit Prozentwerten) ---
  function enableZoneDragAndResize(zoneEl, grip, zoneObj) {
    let mode = null, startX = 0, startY = 0, startLeft = 0, startTop = 0, startW = 0, startH = 0;

    zoneEl.addEventListener('pointerdown', (ev) => {
      if (!state.editing) return;
      ev.stopPropagation();
      mode = (ev.target === grip) ? 'resize' : 'drag';
      zoneEl.setPointerCapture(ev.pointerId);

      startX = ev.clientX;
      startY = ev.clientY;
      startLeft = zoneObj.x;
      startTop  = zoneObj.y;
      startW    = zoneObj.w;
      startH    = zoneObj.h;
    });

    zoneEl.addEventListener('pointermove', (ev) => {
      if (!mode || !state.editing) return;
      const layerRect = zonesLayer.getBoundingClientRect();
      if (!layerRect.width || !layerRect.height) return;

      const dxPct = ((ev.clientX - startX) / layerRect.width) * 100;
      const dyPct = ((ev.clientY - startY) / layerRect.height) * 100;

      if (mode === 'drag') {
        zoneObj.x = Math.round(Math.min(Math.max(startLeft + dxPct, 0), 100 - zoneObj.w) * 10) / 10;
        zoneObj.y = Math.round(Math.min(Math.max(startTop  + dyPct, 0), 100 - zoneObj.h) * 10) / 10;
        zoneEl.style.left = `${zoneObj.x}%`;
        zoneEl.style.top  = `${zoneObj.y}%`;
      } else if (mode === 'resize') {
        zoneObj.w = Math.round(Math.min(Math.max(startW + dxPct, 3), 100 - zoneObj.x) * 10) / 10;
        zoneObj.h = Math.round(Math.min(Math.max(startH + dyPct, 3), 100 - zoneObj.y) * 10) / 10;
        zoneEl.style.width  = `${zoneObj.w}%`;
        zoneEl.style.height = `${zoneObj.h}%`;
      }
    });

    const stopEdit = () => { mode = null; };
    zoneEl.addEventListener('pointerup', stopEdit);
    zoneEl.addEventListener('pointercancel', stopEdit);
  }

  // --- UI & Modals ---
  function showToast(msg) {
    clearTimeout(state.toastTimer);
    toast.textContent = msg;
    toast.classList.remove('hidden');
    state.toastTimer = setTimeout(() => toast.classList.add('hidden'), 2200);
  }

  function updateScore() {
    scoreVal.textContent = state.score;
    const remain = state.total - state.score;
    progressText.textContent = remain > 0 ? `Noch ${remain} offen` : `Fertig 🎯`;
  }

  function openInfoModal(comp) {
    if (!comp) return;
    infoTitle.textContent = comp.label;
    infoBody.innerHTML = comp.info;
    overlay.classList.remove('hidden');
    infoCard.classList.remove('hidden');
  }

  function closeModals() {
    overlay.classList.add('hidden');
    infoCard.classList.add('hidden');
    winCard.classList.add('hidden');
  }

  function checkWin() {
    if (state.score >= state.total) {
      extraInfo.innerHTML = EXTRA_INFO;
      runConfetti(5000);
      infoCard.classList.add('hidden');
      overlay.classList.remove('hidden');
      winCard.classList.remove('hidden');
    }
  }

  // --- Buttons & Events ---
  closeInfoBtn.addEventListener('click', closeModals);
  overlay.addEventListener('click', closeModals);
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModals(); });

  restartBtn.addEventListener('click', () => { closeModals(); resetAll(); });
  resetBtn.addEventListener('click', resetAll);

  function resetAll() {
    state.score = 0;
    selectChip(null);
    updateScore();
    document.querySelectorAll('.chip').forEach(ch => {
      ch.classList.remove('locked', 'selected');
      chipsList.appendChild(ch);
    });
    zonesLayer.querySelectorAll('.zone').forEach(z => z.classList.remove('correct', 'wrong'));
    showToast('Zurückgesetzt');
  }

  shuffleBtn.addEventListener('click', () => {
    const unlocked = Array.from(chipsList.children);
    for (let i = unlocked.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      chipsList.insertBefore(unlocked[j], unlocked[i]);
      [unlocked[i], unlocked[j]] = [unlocked[j], unlocked[i]];
    }
  });

  toggleZonesBtn.addEventListener('click', () => {
    state.showZones = !state.showZones;
    zonesLayer.querySelectorAll('.zone').forEach(z => {
      z.classList.toggle('zones-hidden', !state.showZones);
    });
    toggleZonesBtn.textContent = state.showZones ? 'Zonen ausblenden' : 'Zonen einblenden';
  });

  toggleEditBtn.addEventListener('click', () => {
    state.editing = !state.editing;
    toggleEditBtn.classList.toggle('active-mode', state.editing);
    toggleEditBtn.textContent = state.editing ? 'Editor beenden' : 'Ziel‑Editor';
    renderZones();
    if (!state.editing) {
      saveZones();
    } else {
      showToast('Editor aktiv: Zonen ziehen & Größe ändern');
    }
  });

  function saveZones() {
    localStorage.setItem('zones-' + state.imageKey, JSON.stringify(ZONES));
    showToast('Zonen im Browser gespeichert');
  }
  saveZonesBtn.addEventListener('click', saveZones);

  exportZonesBtn.addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ imageKey: state.imageKey, zones: ZONES }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zones_${state.imageKey}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('Zonen als JSON exportiert');
  });

  importZonesBtn.addEventListener('click', () => zonesFileInput.click());
  zonesFileInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const nextZones = Array.isArray(data) ? data : data.zones;
      if (!nextZones?.length) throw new Error('Leere Zonen-Liste');

      ZONES = nextZones.map(z => ({ key: z.key, x: Number(z.x), y: Number(z.y), w: Number(z.w), h: Number(z.h) }));
      localStorage.setItem('zones-' + state.imageKey, JSON.stringify(ZONES));
      resetAll();
      renderZones();
      showToast('Zonen erfolgreich importiert');
    } catch (err) {
      showToast('Import fehlgeschlagen: Ungültige Datei');
    } finally {
      e.target.value = '';
    }
  });

  fullscreenBtn.addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
      else await document.exitFullscreen();
    } catch {
      showToast('Vollbild wird hier nicht unterstützt');
    }
  });

  // --- Konfetti ---
  function resizeCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }

  function runConfetti(ms = 5000) {
    const colors = ['#23c483', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#a8b3c7'];
    const particles = Array.from({ length: 180 }, () => ({
      x: Math.random() * confettiCanvas.width,
      y: -10 - Math.random() * 200,
      vx: -1 + Math.random() * 2,
      vy: 2 + Math.random() * 3.5,
      size: 4 + Math.random() * 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      angle: Math.random() * Math.PI * 2,
      spin: -0.1 + Math.random() * 0.2
    }));

    let start = null;
    function step(ts) {
      if (!start) start = ts;
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.angle += p.spin;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4);
        ctx.restore();
      });
      if (ts - start < ms) requestAnimationFrame(step);
      else ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
    requestAnimationFrame(step);
  }
</script>
</body>
